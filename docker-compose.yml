services:
  ciberlab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciberlab_purple_team
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - APP_STORAGE_BASE_DIR=/app/storage
      - DOCENTE_PASSWORD=${DOCENTE_PASSWORD:-unsl-docente-2026}
      - HELP_PASSWORD=${HELP_PASSWORD:-socosoco}
    # Límites de recursos pensados para aula simultánea (25-60 estudiantes)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 512M
    mem_limit: 1024m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/files/list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

services:
  ciberlab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciberlab_purple_team
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - APP_STORAGE_BASE_DIR=/app/storage
    # Límites de recursos pensados para estaciones de trabajo universitarias
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/files/list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

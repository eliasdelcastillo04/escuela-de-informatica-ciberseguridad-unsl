# Configuración de Servidor
server.port=8080

# Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:ciberlabdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola H2 para propósitos didácticos (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Almacenamiento local (con fallback relativo si no existe /app/storage)
app.storage.base-dir=/app/storage

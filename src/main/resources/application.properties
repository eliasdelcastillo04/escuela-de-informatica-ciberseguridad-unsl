# Configuración de Servidor y Concurrencia para Sala de Máquinas
server.port=8080
server.tomcat.threads.max=100
server.tomcat.accept-count=100
server.compression.enabled=true

# Base de Datos H2 en Memoria (Pool HikariCP dimensionado para aula simultánea)
spring.datasource.url=jdbc:h2:mem:ciberlabdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# Consola H2 deshabilitada por seguridad multi-estudiante
spring.h2.console.enabled=false

# Almacenamiento local (con fallback relativo si no existe /app/storage)
app.storage.base-dir=/app/storage

# Seguridad y control de aula (sobrescribir con variables de entorno en producción)
app.docente.password=${DOCENTE_PASSWORD:unsl-docente-2026}
app.help.password=${HELP_PASSWORD:socosoco}
app.ratelimit.requests-per-minute=${RATELIMIT_RPM:90}
